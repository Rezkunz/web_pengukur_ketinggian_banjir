                <h2 class="section-title">Edit Profile</h2>
                <div class="glass-panel" style="padding: 25px; border-radius: 15px; margin-bottom: 20px;">
                    <div style="text-align: center; margin-bottom: 20px;">
                        <div id="edit-avatar" style="background: linear-gradient(135deg, #3498db, #2c3e50); color: #fff; width: 80px; height: 80px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin: 0 auto 10px auto;">U</div>
                        <h3 id="edit-role-badge" style="margin: 0; font-size: 0.9rem; color: #fff; background: #58d68d; display: inline-block; padding: 3px 12px; border-radius: 12px;">User</h3>
                    </div>
                    
                    <form id="form-edit-profile" onsubmit="saveProfile(event)">
                        <div class="form-group" style="margin-bottom: 15px;">
                            <label class="form-label">Nama Lengkap</label>
                            <input type="text" id="edit-nama" placeholder="Nama Lengkap Anda" required
                                oninput="const av=document.getElementById('edit-avatar'); if(av && this.value) av.textContent=this.value.charAt(0).toUpperCase();">
                        </div>
                        
                        <div class="form-group" style="margin-bottom: 20px;">
                            <label class="form-label form-label-muted">Email (Tidak dapat diubah)</label>
                            <input type="email" id="edit-email" disabled>
                        </div>

                        <div style="display: flex; gap: 10px;">
                            <button type="button" onclick="closeEditProfile()" class="btn-cancel">Batal</button>
                            <button type="submit" class="btn-save">Simpan</button>
                        </div>
                    </form>
                </div>
